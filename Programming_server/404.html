<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            overflow: hidden;
        }

        /* Floating background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            animation: float 8s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 250px;
            height: 250px;
            background: #3b82f660;
            top: 10%;
            left: 10%;
        }

        .circle:nth-child(2) {
            width: 180px;
            height: 180px;
            background: #8b5cf660;
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 120px;
            height: 120px;
            background: #06b6d460;
            top: 20%;
            right: 25%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }
        }

        .container {
            position: relative;
            z-index: 10;
        }

        .card {
            width: 700px;
            max-width: 90%;
            padding: 60px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 25px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            transform-style: preserve-3d;
        }

        .error-number {
            font-size: 9rem;
            font-weight: 800;
            background: linear-gradient(45deg, #60a5fa, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 30px rgba(96, 165, 250, 0.5);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.05);
            }
        }

        h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            text-decoration: none;
            color: white;
            font-weight: 600;

            border-radius: 50px;

            background: linear-gradient(135deg,
                    #3b82f6,
                    #8b5cf6);

            box-shadow:
                0 10px 25px rgba(59, 130, 246, .4);

            transition: .4s;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow:
                0 20px 40px rgba(59, 130, 246, .5);
        }

        .rocket {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            animation: rocket 3s ease-in-out infinite;
        }

        @keyframes rocket {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">

        <div class="card">

            <span class="rocket">🚀</span>

            <div class="error-number">
                404
            </div>

            <h2>Oops! Page Not Found</h2>

            <p>
                The page you're looking for seems to have drifted
                into another galaxy. Let's get you back to safety.
            </p>

            <a href="/" class="btn">
                Back To Home
            </a>

        </div>

    </div>

</body>

</html>
