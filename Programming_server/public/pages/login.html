<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #312e81);
            font-family: Poppins, sans-serif;
        }

        .login {

            width: 90%;
            max-width: 400px;

            padding: 40px;

            background: rgba(255, 255, 255, .1);

            backdrop-filter: blur(20px);

            border-radius: 20px;

            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            outline: none;
            border-radius: 10px;
        }

        button {

            width: 100%;

            padding: 15px;

            background: #3b82f6;

            border: none;

            border-radius: 10px;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Login</h1>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>
            Sign In
        </button>

    </div>

</body>

</html>
