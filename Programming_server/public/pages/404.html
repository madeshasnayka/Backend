<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg,
                    #0f172a,
                    #1e293b,
                    #312e81);
            position: relative;
        }

        /* Floating Background */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            animation: float 8s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 260px;
            height: 260px;
            background: rgba(59, 130, 246, .4);
            top: 8%;
            left: 6%;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            background: rgba(168, 85, 247, .4);
            bottom: 10%;
            right: 8%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 140px;
            height: 140px;
            background: rgba(6, 182, 212, .4);
            top: 20%;
            right: 20%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* Container */

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        /* Card */

        .card {
            width: 700px;
            max-width: 100%;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            padding: 60px;

            text-align: center;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);

            animation: cardFloat 5s ease-in-out infinite;
        }

        @keyframes cardFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Rocket */

        .rocket {
            display: block;
            font-size: 70px;
            margin-bottom: 15px;
            animation: rocketMove 3s ease-in-out infinite;
        }

        @keyframes rocketMove {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* 404 Number */

        .error-number {
            font-size: 9rem;
            font-weight: 800;

            background: linear-gradient(45deg,
                    #60a5fa,
                    #38bdf8,
                    #a855f7);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 30px rgba(96, 165, 250, .5);

            margin-bottom: 10px;

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.05);
            }
        }

        h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 500px;
            margin-inline: auto;
        }

        /* Button */

        .btn {
            display: inline-block;
            text-decoration: none;

            padding: 15px 35px;

            border-radius: 50px;

            color: white;
            font-weight: 600;

            background: linear-gradient(135deg,
                    #3b82f6,
                    #8b5cf6);

            box-shadow:
                0 10px 25px rgba(59, 130, 246, .4);

            transition: .4s;
        }

        .btn:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 35px rgba(59, 130, 246, .6);
        }

        /* Tablet */

        @media(max-width:768px) {

            .card {
                padding: 40px 30px;
            }

            .error-number {
                font-size: 6rem;
            }

            h2 {
                font-size: 1.7rem;
            }

            p {
                font-size: .95rem;
            }

            .rocket {
                font-size: 55px;
            }

            .circle:nth-child(1) {
                width: 180px;
                height: 180px;
            }

            .circle:nth-child(2) {
                width: 150px;
                height: 150px;
            }

            .circle:nth-child(3) {
                width: 100px;
                height: 100px;
            }
        }

        /* Mobile */

        @media(max-width:480px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .rocket {
                font-size: 45px;
            }

            .error-number {
                font-size: 4.5rem;
                line-height: 1;
            }

            h2 {
                font-size: 1.4rem;
            }

            p {
                font-size: .9rem;
                margin-bottom: 25px;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 14px;
            }

            .circle:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">

        <div class="card">

            <span class="rocket">🚀</span>

            <div class="error-number">404</div>

            <h2>Oops! Page Not Found</h2>

            <p>
                The page you're looking for appears to have drifted
                into another galaxy. Don't worry, we'll help you
                navigate back to safety.
            </p>

            <a href="/" class="btn">
                Back To Home
            </a>

        </div>

    </div>

</body>

</html>
